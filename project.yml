name: LibrePaw
options:
  bundleIdPrefix: org.librepaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TraccarKit:
    path: Packages/TraccarKit
  LibrePawKit:
    path: Packages/LibrePawKit
  # The project's first external dependency (see ADR-0028): renders
  # OpenFreeMap's openly-licensed OSM-based vector tiles, no API key needed.
  # Pinned exactly rather than `from:`: the generated project (and with it
  # Package.resolved) isn't committed, so a range would let every fresh
  # checkout and CI run silently pick up whatever newer release exists.
  # Bump deliberately.
  MapLibreSwiftUI:
    url: https://github.com/maplibre/swiftui-dsl
    exactVersion: 0.27.0

targets:
  LibrePaw:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibrePaw/Sources
      - path: LibrePaw/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.librepaw.app
        PRODUCT_NAME: LibrePaw
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is intentionally not set here - project.yml is shared/
    # committed, and this value is personal per developer. It comes from
    # Config/Local.xcconfig instead (gitignored; see Config/Local.xcconfig.example),
    # which `xcodegen generate` only *references* rather than writes, so it
    # survives every regeneration.
    configFiles:
      Debug: LibrePaw/Config/Local.xcconfig
      Release: LibrePaw/Config/Local.xcconfig
    dependencies:
      - package: LibrePawKit
      - package: MapLibreSwiftUI
    info:
      path: LibrePaw/Resources/Info.plist
      properties:
        CFBundleDisplayName: LibrePaw
        # Substituted from the MARKETING_VERSION/CURRENT_PROJECT_VERSION build
        # settings above at build time - XcodeGen's own Info.plist defaults
        # otherwise hardcode "1.0"/"1" regardless of those settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "LibrePaw uses your location to show how far away your pet is and to point you in their direction in the Find Pet screen."
        # Needed for NavigationApp.isInstalled's canOpenURL checks: without
        # a scheme being declared here, canOpenURL always returns false for
        # it, installed or not, so "Navigate to <Pet>" would only ever
        # offer Apple Maps.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - waze
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    scheme:
      testTargets:
        - LibrePawTests
        - LibrePawUITests
      gatherCoverageData: true

  LibrePawTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibrePawTests
    dependencies:
      - target: LibrePaw
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

  LibrePawUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LibrePawUITests
    dependencies:
      - target: LibrePaw
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LibrePaw:
    build:
      targets:
        LibrePaw: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LibrePawTests
        - LibrePawUITests
    archive:
      config: Release
