name: Scentrail
options:
  bundleIdPrefix: org.scentrail
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TraccarKit:
    path: Packages/TraccarKit
  ScentrailKit:
    path: Packages/ScentrailKit

targets:
  Scentrail:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Scentrail/Sources
      - path: Scentrail/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.scentrail.app
        PRODUCT_NAME: Scentrail
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ScentrailKit
    info:
      path: Scentrail/Resources/Info.plist
      properties:
        CFBundleDisplayName: Scentrail
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    scheme:
      testTargets:
        - ScentrailTests
        - ScentrailUITests
      gatherCoverageData: true

  ScentrailTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScentrailTests
    dependencies:
      - target: Scentrail
    settings:
      base:
        SWIFT_VERSION: 6.0

  ScentrailUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ScentrailUITests
    dependencies:
      - target: Scentrail
    settings:
      base:
        SWIFT_VERSION: 6.0

schemes:
  Scentrail:
    build:
      targets:
        Scentrail: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ScentrailTests
        - ScentrailUITests
    archive:
      config: Release
