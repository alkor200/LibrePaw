name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: Test Swift packages
    runs-on: macos-15
    strategy:
      matrix:
        package: [TraccarKit, LibrePawKit]
    steps:
      - uses: actions/checkout@v4
      - name: swift test (${{ matrix.package }})
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    name: Build and test iOS app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Create a CI-only Local.xcconfig
        # Local.xcconfig is gitignored (see ADR-0015, per-developer signing
        # config), so it doesn't exist on a fresh checkout. project.yml
        # references it as a configFile, and xcodegen refuses to generate
        # at all if a referenced configFile path doesn't exist, empty or
        # not. No DEVELOPMENT_TEAM is needed here: building for the
        # simulator (not a device) needs no real code signing.
        run: |
          mkdir -p LibrePaw/Config
          echo "// CI-only, see .github/workflows/ci.yml" > LibrePaw/Config/Local.xcconfig
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project LibrePaw.xcodeproj \
            -scheme LibrePaw \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            | xcpretty
      - name: Build Release configuration
        # The test step above only ever compiles Debug, where DEBUG-only
        # code (PreviewSupport, #Preview canvases) is always available. A
        # Release build is what an archive actually compiles, so it gets
        # its own check, otherwise a DEBUG-only symbol leaking into shared
        # code only surfaces at archive time.
        run: |
          set -o pipefail
          xcodebuild build \
            -project LibrePaw.xcodeproj \
            -scheme LibrePaw \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
